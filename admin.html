<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal | SetsByBryalla</title>
  <style>
    body { font-family: sans-serif; background: #0D0D0D; color: #FAF6EF; padding: 2rem; max-width: 600px; margin: 0 auto; }
    h1 { color: #C9A84C; font-weight: 300; }
    .card { background: #1A1A1A; padding: 1.5rem; border: 1px solid #C9A84C; margin-bottom: 2rem; border-radius: 4px; }
    input, button { width: 100%; padding: 0.8rem; margin-top: 0.5rem; box-sizing: border-box; }
    input { background: #0D0D0D; border: 1px solid #7A6A50; color: #FAF6EF; }
    button { background: #C9A84C; border: none; font-weight: bold; cursor: pointer; margin-top: 1rem; }
    button:hover { background: #E8D5A3; }
    .hidden { display: none; }
    .delete-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 1rem; }
    .delete-item img { width: 100%; aspect-ratio: 1; object-fit: cover; }
    .btn-danger { background: #8B0000; color: white; margin-top: 4px; padding: 0.4rem; font-size: 0.7rem; }
  </style>
</head>
<body>

  <h1>Owner Admin Portal</h1>

  <div id="loginSection" class="card">
    <h3>Enter Admin Password</h3>
    <input type="password" id="adminPassword" placeholder="Enter Password">
    <button onclick="login()">Log In</button>
  </div>

  <div id="dashboard" class="hidden">
    
    <div class="card">
      <h3>Upload New Photo</h3>
      <input type="file" id="fileInput" accept="image/*">
      <button onclick="uploadPhoto()">Upload Photo</button>
    </div>

    <div class="card">
      <h3>Manage Existing Photos</h3>
      <button onclick="loadManagePhotos()">Load Photos to Delete</button>
      <div id="deleteGrid" class="delete-grid"></div>
    </div>

  </div>

  <p id="statusMessage" style="color:#C9A84C; text-align:center; font-weight:bold; margin-top:1.5rem;"></p>

  <script>
    let savedPassword = '';

    function login() {
      savedPassword = document.getElementById('adminPassword').value;
      if (!savedPassword) return alert('Please enter a password');
      
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      showMessage('Logged in. Ready to manage photos.');
    }

    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });

    async function uploadPhoto() {
      const fileInput = document.getElementById('fileInput');
      if (!fileInput.files[0]) return alert('Select a photo first');
      
      const file = fileInput.files[0];
      const base64Data = await toBase64(file);
      const fileName = Date.now() + '-' + file.name.replace(/\s+/g, '-');

      showMessage('Uploading photo...');

      try {
        const res = await fetch('/.netlify/functions/manage-photos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'upload',
            password: savedPassword,
            fileName: fileName,
            fileData: base64Data
          })
        });

        const data = await res.json();
        showMessage(data.message || 'Upload process complete.');
        if (res.ok) fileInput.value = '';
      } catch (err) {
        showMessage('Error uploading: ' + err.message);
      }
    }

    async function loadManagePhotos() {
      const grid = document.getElementById('deleteGrid');
      grid.innerHTML = 'Loading...';

      try {
        const res = await fetch('https://api.github.com/repos/arnoldjaoko/SetsByBryalla/contents/images?ref=main');
        const files = await res.json();
        
        grid.innerHTML = '';
        if (!Array.isArray(files)) {
          grid.innerHTML = 'No photos found.';
          return;
        }

        files.forEach(f => {
          if (f.type === 'file') {
            const div = document.createElement('div');
            div.className = 'delete-item';
            div.innerHTML = `
              <img src="${f.download_url}">
              <button class="btn-danger" onclick="deletePhoto('${f.name}')">Delete</button>
            `;
            grid.appendChild(div);
          }
        });
      } catch (err) {
        grid.innerHTML = 'Error loading photos.';
      }
    }

    async function deletePhoto(fileName) {
      if (!confirm(`Are you sure you want to delete ${fileName}?`)) return;
      
      showMessage('Deleting photo...');

      try {
        const res = await fetch('/.netlify/functions/manage-photos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'delete',
            password: savedPassword,
            fileName: fileName
          })
        });

        const data = await res.json();
        showMessage(data.message || 'Delete process complete.');
        if (res.ok) loadManagePhotos();
      } catch (err) {
        showMessage('Error deleting: ' + err.message);
      }
    }

    function showMessage(msg) {
      document.getElementById('statusMessage').innerText = msg;
    }
  </script>
</body>
</html>
